[project]
name = "benstack-aws-server"
revision = "1.0"

[providers]
bitwarden_secrets = "bws://vault.bitwarden.com@12e813d4-0090-4c28-8b30-b4b501827f4c"

[profiles.development.defaults]
providers = ["bitwarden_secrets"]

[profiles.development]
BETTER_AUTH_SECRET = { description = "Backend authentication signing secret", required = true }
BETTER_AUTH_URL = { description = "Backend public URL", required = true }
CORS_ORIGIN = { description = "Allowed browser origin", required = true }
ALLOWED_EMAILS = { description = "Comma-separated list of permitted users", required = true }
DATABASE_URL = { description = "Primary PostgreSQL connection string", required = true }
READONLY_DB_PASSWORD = { description = "Legacy read-only database password; currently unused", required = false }
CHAT_DATABASE_URL = { description = "Legacy chat database URL; currently unused", required = false }
S3_RECEIPTS_BUCKET = { description = "S3 bucket used for receipt objects", required = true }
GOOGLE_API_KEY = { description = "Optional Google AI provider credential", required = false }
GROQ_API_KEY = { description = "Optional Groq AI provider credential", required = false }
ANTHROPIC_API_KEY = { description = "Optional Anthropic provider credential", required = false }

NODE_ENV = { description = "Node runtime mode", required = false, default = "development" }
